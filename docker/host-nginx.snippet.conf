# 加到现有站点的 server { } 里（和 Print Studio 同一个 80 端口）
# 访问地址：http://8.141.13.235/translate/

location = /translate {
    return 301 /translate/;
}

location /translate/ {
    proxy_pass http://127.0.0.1:8080/translate/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
