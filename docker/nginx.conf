server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    location = /translate {
        return 301 /translate/;
    }

    location /translate/ {
        try_files $uri $uri/ /translate/index.html;
    }

    location ~* ^/translate/.*\.(css|png|ico|svg|woff2)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
